services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_ENV: dev
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
        NEXT_PUBLIC_TOSS_CLIENT_KEY: ${NEXT_PUBLIC_TOSS_CLIENT_KEY}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
      - NEXT_PUBLIC_TOSS_CLIENT_KEY=${NEXT_PUBLIC_TOSS_CLIENT_KEY}
    depends_on:
      - backend
    networks:
      - meongtory-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/meongtory
      - SPRING_DATASOURCE_USERNAME=meongtory_user
      - SPRING_DATASOURCE_PASSWORD=meongtory123!
      - SERVER_PORT=${BACKEND_PORT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - NAVER_API_CLIENT_ID=${NAVER_API_CLIENT_ID}
      - NAVER_API_CLIENT_SECRET=${NAVER_API_CLIENT_SECRET}
      - OAUTH2_REDIRECT_URI_BASE=${OAUTH2_REDIRECT_URI_BASE:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - ai
    networks:
      - meongtory-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - DB_USER=meongtory_user
      - DB_PASSWORD=meongtory123!
      - DB_NAME=meongtory
      - DB_HOST=db
      - DB_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL}
      - OPENAI_BREEDING_MODEL=${OPENAI_BREEDING_MODEL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
      - VECTORSTORE_COLLECTION_NAME=${VECTORSTORE_COLLECTION_NAME}
      - VECTORSTORE_DISTANCE_STRATEGY=${VECTORSTORE_DISTANCE_STRATEGY}
      - VECTORSTORE_SEARCH_LIMIT=${VECTORSTORE_SEARCH_LIMIT:-5}
      - SAMPLE_DATA_PATH=${SAMPLE_DATA_PATH}
      - PROMPT_TEMPLATE_PATH=${PROMPT_TEMPLATE_PATH}
    volumes:
      - ./ai:/app
      - ./ai/chatBot:/app/chatBot
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000", "--reload"]
    networks:
      - meongtory-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=meongtory_user
      - POSTGRES_PASSWORD=meongtory123!
      - POSTGRES_DB=meongtory
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "0.0.0.0:5433:5432"
    networks:
      - meongtory-network
    command: |
      bash -c "
        docker-entrypoint.sh postgres &
        sleep 10
        cp /docker-entrypoint-initdb.d/pg_hba.conf /var/lib/postgresql/data/pg_hba.conf
        chmod 600 /var/lib/postgresql/data/pg_hba.conf
        chown postgres:postgres /var/lib/postgresql/data/pg_hba.conf
        pg_ctl reload -D /var/lib/postgresql/data
        wait
      "

networks:
  meongtory-network:
    driver: bridge

volumes:
  postgres_data: